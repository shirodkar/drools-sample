<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Drools Rule Engine</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="container">
    <header>
        <h1>Drools 6.5 Rule Engine</h1>
        <p class="subtitle">Order Processing &amp; Discount Calculator</p>
    </header>

    <div class="layout">
        <section class="card input-card">
            <h2>Order Details</h2>
            <form id="orderForm">
                <div class="field">
                    <label for="totalAmount">Order Amount ($)</label>
                    <input type="number" id="totalAmount" step="0.01" min="0" value="250" required/>
                </div>
                <div class="field">
                    <label for="itemCount">Item Count</label>
                    <input type="number" id="itemCount" min="1" value="3" required/>
                </div>
                <div class="field">
                    <label for="customerType">Customer Type</label>
                    <select id="customerType">
                        <option value="REGULAR">Regular</option>
                        <option value="PREMIUM">Premium</option>
                        <option value="VIP" selected>VIP</option>
                    </select>
                </div>
                <div class="field">
                    <label for="couponCode">Coupon Code</label>
                    <input type="text" id="couponCode" placeholder="e.g. SAVE20, WELCOME10"/>
                </div>
                <button type="submit" id="submitBtn">Evaluate Rules</button>
            </form>

            <div class="coupons-info">
                <h3>Available Coupons</h3>
                <span class="coupon-tag">SAVE20</span>
                <span class="coupon-tag">WELCOME10</span>
            </div>
        </section>

        <section class="card result-card" id="resultCard" style="display:none;">
            <h2>Results</h2>
            <div class="result-grid">
                <div class="stat">
                    <span class="stat-label">Discount</span>
                    <span class="stat-value" id="discountPct">0%</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Saved</span>
                    <span class="stat-value green" id="discountAmt">$0.00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Final Amount</span>
                    <span class="stat-value accent" id="finalAmount">$0.00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Shipping</span>
                    <span class="stat-value" id="shipping">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Loyalty Points</span>
                    <span class="stat-value gold" id="loyaltyPoints">0</span>
                </div>
            </div>

            <div class="rules-section">
                <h3>Fired Rules</h3>
                <ul id="firedRules"></ul>
            </div>

            <div class="messages-section">
                <h3>Rule Messages</h3>
                <ul id="messages"></ul>
            </div>
        </section>
    </div>

    <section class="card rules-info-card">
        <h2>Loaded Rules</h2>
        <div id="rulesInfo"><em>Loading...</em></div>
    </section>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
